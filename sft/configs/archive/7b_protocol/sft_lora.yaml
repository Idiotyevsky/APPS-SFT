# SFT LoRA 主配置 —— 见 docs/LLAMA_FACTORY_SFT_IMPLEMENTATION_SPEC.md §8.2
model_name_or_path: /home/zfs02/model/Qwen2.5-Coder-7B-Instruct
trust_remote_code: false
stage: sft
do_train: true
do_eval: true
